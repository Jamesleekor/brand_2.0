name: Temp Rakaruka Admin CI

on:
  push:
    branches:
      - feat/rakaruka-daily-limit-admin-analytics
    paths:
      - .github/workflows/_temp_rakaruka_admin_ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:tikatuka
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLASSROOM_ID: ${{ secrets.VITE_CLASSROOM_ID }}
