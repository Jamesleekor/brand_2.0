name: Starlink Development Check

on:
  push:
    branches:
      - 'starlink-*'
      - 'feat/starlink-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Starlink deterministic tests
        run: npm run test:starlink

      - name: Rakaruka regression tests
        run: npm run test:tikatuka

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLASSROOM_ID: ${{ secrets.VITE_CLASSROOM_ID }}


  sql-golden:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starlink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d starlink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prepare minimal Arcade SQL baseline
        run: |
          psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;

          CREATE TABLE public.arcade_games(
            id bigserial PRIMARY KEY,
            code text NOT NULL UNIQUE
          );

          CREATE TABLE public.arcade_game_rule_versions(
            id bigserial PRIMARY KEY,
            game_id bigint NOT NULL REFERENCES public.arcade_games(id),
            version_code text NOT NULL,
            config jsonb NOT NULL,
            UNIQUE(game_id,version_code)
          );

          INSERT INTO public.arcade_games(code) VALUES('starlink_04');

          INSERT INTO public.arcade_game_rule_versions(game_id,version_code,config)
          SELECT
            g.id,
            'starlink_04_v0.3',
            jsonb_build_object(
              'loopMinUniqueCount',5,
              'loopMinTwiceArea',2,
              'initialGenerationAttempts',64,
              'reshuffleAttempts',64,
              'fallbackTargetCells',jsonb_build_array(23,24,25),
              'rngInitialDomain',2738958700,
              'rngRefillDomain',3355524772,
              'rngReshuffleDomain',2911926141,
              'rngZeroFallback',1831565813
            )
          FROM public.arcade_games g
          WHERE g.code='starlink_04';

          CREATE OR REPLACE FUNCTION public.arcade_xorshift32_next(p_state bigint)
          RETURNS bigint
          LANGUAGE plpgsql
          IMMUTABLE
          STRICT
          SET search_path = public, pg_temp
          AS $function$
          DECLARE
            v_state bigint := p_state;
          BEGIN
            IF p_state NOT BETWEEN 1 AND 4294967295 THEN
              RAISE EXCEPTION '[ARCADE] xorshift32 state must be a non-zero unsigned 32-bit integer.'
                USING ERRCODE = 'P0190';
            END IF;

            v_state := (v_state # ((v_state << 13) & 4294967295)) & 4294967295;
            v_state := (v_state # (v_state >> 17)) & 4294967295;
            v_state := (v_state # ((v_state << 5) & 4294967295)) & 4294967295;
            RETURN v_state;
          END;
          $function$;
          SQL

      - name: Apply Starlink deterministic SQL engine
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261011_05_starlink_04_deterministic_board_engine.sql

      - name: Run deterministic board SQL golden postcheck
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/tests/starlink_04_deterministic_board_golden.sql

      - name: Apply Starlink path loop scoring SQL engine
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261011_06_starlink_04_path_scoring_engine.sql

      - name: Run path loop scoring SQL golden postcheck
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/tests/starlink_04_path_scoring_golden.sql

      - name: Apply Starlink internal full-run replay
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261012_01_starlink_04_full_run_replay.sql

      - name: Run full-run replay Golden and timing postcheck
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/tests/starlink_04_full_run_replay_golden.sql

      - name: Prepare isolated Arcade Core bridge fixture
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/tests/starlink_04_core_integration_ephemeral_baseline.sql

      - name: Apply server nonce-bound Starlink submission and seed pack
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261012_02_starlink_04_arcade_core_submission.sql

      - name: Verify full Arcade Core bridge end-to-end
        run: psql -h 127.0.0.1 -U postgres -d starlink_ci -v ON_ERROR_STOP=1 -f supabase/tests/starlink_04_arcade_core_bridge_e2e.sql
